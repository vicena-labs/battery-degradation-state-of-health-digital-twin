[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="battery-degradation-research-twin"
version="0.1.0"
description="Executable battery electro-thermal, aging, SOH, and held-out validation research twin"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
dependencies=["numpy>=1.24","pandas>=2.0","scipy>=1.10","scikit-learn>=1.3","matplotlib>=3.7"]
[project.optional-dependencies]
dev=["pytest>=7","jupyter>=1"]
[project.scripts]
battery-twin="battery_twin.cli:main"
[tool.setuptools.packages.find]
where=["src"]
